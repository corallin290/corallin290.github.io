<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500&display=swap">
  <link rel="stylesheet" href="css/terminal.css">
</head>
<body class="picker-page">
  <div class="picker fade-in">
    <div class="lang-selector" data-lang-selector-inline></div>
    <h1 data-i18n="welcome.heading">Welcome</h1>
    <p data-i18n="welcome.subtitle">Choose how you'd like to explore:</p>
    <div class="picker-buttons">
      <a href="terminal" class="picker-btn" data-i18n="welcome.btn.terminal">Terminal Mode</a>
      <a href="interactive" class="picker-btn" data-i18n="welcome.btn.interactive">Interactive Mode</a>
    </div>
  </div>
  <script type="module" src="js/welcome.js"></script>
</body>
</html>
